<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00c2c3">
  <meta name="description" content="得物商家入驻 · 智能填写交互演示">
  <title>得物商家入驻</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=940f9d137b">
  <script src="app.js?v=a44f90ee98" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-course" viewBox="0 0 24 24"><path d="m2 9 10-6 10 6-10 6L2 9Zm4 3v6c4 3 8 3 12 0v-6m4-3v8"/></symbol>
    <symbol id="i-rules" viewBox="0 0 24 24"><path d="M9 5H5v17h14V5h-4M9 2h6v6H9V2Zm0 11h6m-6 4h4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 8 3v7c0 5-8 10-8 10S4 17 4 12V5l8-3Zm-4 9 3 3 5-6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M7 18H6a5 5 0 0 1-.6-10 7 7 0 0 1 13.3-1A5.5 5.5 0 0 1 19 18h-2M12 22V12m-4 4 4-4 4 4"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 0 0-2 2v4m12-6h4a2 2 0 0 1 2 2v4M3 15v4a2 2 0 0 0 2 2h4m6 0h4a2 2 0 0 0 2-2v-4M3 12h18"/></symbol>
    <symbol id="i-service" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v7c0 3-3 4-6 4M4 11H2v7h5v-7H4Zm16 0h2v7h-5v-7h3Z"/></symbol>
    <symbol id="i-feedback" viewBox="0 0 24 24"><path d="M13 3H3v18h16v-8M7 7h6M7 11h3m2 5 2-5 7-7 2 2-7 7-4 3Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <header class="site-header">
    <a class="brand" href="./" aria-label="得物商家后台首页">
      <img class="brand-logo" src="assets/logo.svg" alt="得物" width="40" height="40">
      <img class="brand-wordmark" src="assets/merchant-title.png" alt="商家后台" width="128" height="34">
    </a>
    <nav class="header-nav" aria-label="顶部导航">
      <button data-action="course"><svg class="icon"><use href="#i-course"/></svg>课堂</button>
      <span class="nav-divider"></span>
      <button data-action="rules"><svg class="icon"><use href="#i-rules"/></svg>规则</button>
      <span class="nav-divider"></span>
      <button data-action="report"><svg class="icon"><use href="#i-shield"/></svg>举报</button>
      <span class="nav-divider"></span>
      <button class="logout" data-action="logout">退出</button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="benefit-banner" aria-label="入驻权益">
      <div class="banner-top">
        <h1><img src="assets/title.png" alt="完成以下认证，即刻入驻得物吧～" width="344" height="24"></h1>
        <div class="banner-actions">
          <button class="ai-entry" data-action="ai"><img src="assets/ai-entry.png" alt="AI 智能入驻" width="84" height="20"></button>
          <button class="text-link" data-action="video">查看入驻视频</button>
        </div>
      </div>
      <ul class="benefits">
        <li><img src="assets/benefit-users.png" alt="" width="18" height="18"><span>5 亿年轻流量精准触达</span></li>
        <li><img src="assets/benefit-tag.png" alt="" width="18" height="18"><span>官方鉴别正品背书</span></li>
        <li><img src="assets/benefit-chart.png" alt="" width="18" height="18"><span>低退货率高利润空间</span></li>
        <li><img src="assets/benefit-cart.png" alt="" width="18" height="18"><span>平台扶持全程护航</span></li>
      </ul>
    </section>

    <section class="entry-progress" aria-label="入驻进度">
      <div class="progress-step active" aria-current="step"><span class="step-number">1</span><span>提交资料</span></div>
      <span class="step-connector"></span>
      <div class="progress-step"><span class="step-number">2</span><span>平台审核</span></div>
      <span class="step-connector"></span>
      <div class="progress-step"><span class="step-number">3</span><span>完善信息</span></div>
      <span class="step-connector"></span>
      <div class="progress-step"><span class="step-number">4</span><span>入驻成功</span></div>
    </section>

    <div class="content-columns">
      <section class="main-form" aria-label="填写类目资质信息">
        <div class="form-progress" aria-label="资料填写步骤">
          <div class="form-progress-line"></div>
          <div class="form-step first"><span class="form-step-dot"></span><span>填写企业信息</span></div>
          <div class="form-step current" aria-current="step"><span class="form-step-dot"></span><span>填写类目资质信息</span></div>
        </div>

        <section class="smart-entry" id="smart-entry" aria-labelledby="smart-title">
          <h2 class="section-title" id="smart-title">智能入驻填写</h2>
          <div class="smart-content">
            <section class="form-card upload-card" aria-labelledby="upload-title">
              <div class="card-heading">
                <h3 id="upload-title">上传主体资质</h3>
                <button class="primary-button scan-button" data-action="scan"><svg class="icon"><use href="#i-scan"/></svg>扫码上传</button>
              </div>
              <div class="upload-body">
                <div class="upload-description"><p>信息智能识别，全程自动审核，快速高效入驻</p><button class="text-link" data-action="sample">查看内容样例</button></div>
                <input id="file-input" type="file" multiple accept="image/jpeg,image/png" hidden>
                <button id="upload-zone" class="upload-zone" type="button" aria-label="将 JPG 或 PNG 文件拖拽至此处，或点击上传">
                  <svg class="upload-icon icon"><use href="#i-upload"/></svg>
                  <span class="upload-callout">将文件拖拽至此处，或<span class="text-link">点击上传</span></span>
                  <span class="upload-instructions">请上传您的所有资料，包括不限于法人身份证正反面、营业执照、商标注册证、品牌授权书，被授权人身份证正反面（您可根据实际经营范围，全部或部分上传上述所需材料类型）；</span>
                  <span class="upload-formats">支持JPG、PNG格式，文件大小不超过 100M；</span>
                </button>
                <p id="upload-error" class="error-message" role="alert" hidden></p>
                <div id="draft-notice" class="draft-hint" hidden></div>
                <ul id="file-list" class="file-list" aria-label="已添加的资质文件" hidden></ul>
              </div>
            </section>

            <div class="submit-row"><button id="confirm-submit" class="primary-button">确认并提交</button></div>
          </div>
        </section>
      </section>

      <aside class="helper-panel" aria-labelledby="helper-title">
        <div class="helper-heading"><h2 id="helper-title">填写小助手</h2></div>
        <div class="helper-body">
          <h3>主营品牌</h3>
          <p class="helper-description"><span>1.主营品牌：</span>入驻主营品牌即商标注册证中的名称，请保持一致</p>
          <h3 class="example-heading">示例</h3>
          <div class="certificate-example"><img src="assets/trademark-sample.svg" alt="商标注册证填写示例，品牌名称位置以红框标注，证件信息已脱敏" width="256" height="366"></div>
        </div>
      </aside>
    </div>
  </main>

  <aside class="floating-tools" aria-label="快捷帮助">
    <img class="floating-avatar" src="assets/ai-avatar.png" alt="" width="40" height="40">
    <button class="floating-ai" data-action="ai" aria-label="AI智能入驻"><img src="assets/ai-float.png" alt="AI" width="28" height="28"></button>
    <button data-action="service"><svg class="icon"><use href="#i-service"/></svg><span>客服</span></button>
    <button data-action="feedback"><svg class="icon"><use href="#i-feedback"/></svg><span>反馈</span></button>
  </aside>

  <footer class="bottom-bar" aria-label="表单操作">
    <button id="save-draft" class="secondary-button">存草稿</button>
    <button id="previous-step" class="secondary-button">上一步</button>
  </footer>

  <dialog id="demo-dialog" class="demo-dialog" aria-labelledby="dialog-title">
    <div class="modal-heading"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div id="dialog-body" class="modal-body"></div>
    <div class="modal-footer"><button id="dialog-ok" class="primary-button">我知道了</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
